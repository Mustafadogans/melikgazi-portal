<!DOCTYPE html>
<html lang="tr">
<head>
    <script src="assets/js/auth.js"></script>
    <script>checkAdminRole();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melikgazi - Modüller</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dashboard_glass.css" id="global-glass-theme">
</head>
<body>

    <div id="navbar-container"></div>

      <div id="sidebar-container"></div>

      <div class="content-area" id="contentArea">
        <a href="dashboard.html" class="btn-back-dashboard"><i class="fas fa-arrow-left"></i> Ana Menüye Dön</a>
        <div class="page-title">MODÜLLER</div>
        
        <div class="form-card">
            <div class="row">
                <div class="col-md-8">
                    <div class="row">
                        <div class="col-md-2 form-group">
                            <label>SIRA</label>
                            <input type="number" class="form-control" id="m_sira" value="1">
                        </div>
                        <div class="col-md-10 form-group">
                            <label>MODÜL İKON</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i id="iconPreview" class="fas fa-cube"></i></span>
                                </div>
                                <select class="form-control" id="m_ikon" onchange="document.getElementById('iconPreview').className = this.value">
                                    <option value="fas fa-cube">Küp (Varsayılan)</option>
                                    <option value="fas fa-star">Yıldız</option>
                                    <option value="fas fa-chart-line">Grafik / Analiz</option>
                                    <option value="fas fa-users">Kullanıcılar / Ekip</option>
                                    <option value="fas fa-cog">Ayarlar / Çark</option>
                                    <option value="fas fa-file-alt">Döküman / Rapor</option>
                                    <option value="fas fa-envelope">E-Posta / Mesaj</option>
                                    <option value="fas fa-calendar-alt">Takvim / Ajanda</option>
                                    <option value="fas fa-building">Bina / Tesis</option>
                                    <option value="fas fa-car">Araç / Ulaşım</option>
                                    <option value="fas fa-map-marked-alt">Harita / Konum</option>
                                    <option value="fas fa-cloud">Bulut / Depolama</option>
                                    <option value="fas fa-camera">Kamera / Güvenlik</option>
                                    <option value="fas fa-phone-alt">Telefon / İletişim</option>
                                    <option value="fas fa-book">Kitap / Kütüphane</option>
                                    <option value="fas fa-heart">Kalp / Sağlık</option>
                                    <option value="fas fa-gavel">Hukuk / Çekiç</option>
                                    <option value="fas fa-leaf">Doğa / Park</option>
                                    <option value="fas fa-tools">Araç Gereç / Bakım</option>
                                    <option value="fas fa-shield-alt">Güvenlik / Kalkan</option>
                                    <option value="fas fa-wallet">Cüzdan / Finans</option>
                                    <option value="fas fa-bullhorn">Duyuru / Megafon</option>
                                    <option value="fas fa-link">Bağlantı / Link</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label>LİSTE TİPİ</label>
                            <select class="form-control" id="m_liste">
                                <option>Uygulamalar</option>
                                <option>Sistemler</option>
                            </select>
                        </div>
                        <div class="col-md-6 form-group">
                            <label>MODÜL NASIL AÇILSIN?</label>
                            <select class="form-control" id="m_acilis">
                                <option value="direkt">Yeni Sekmede (Direkt Link)</option>
                                <option value="modal">Pencere İçinde (Modal)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>MODÜL ADI</label>
                        <input type="text" class="form-control" id="m_adi" placeholder="Modülün görünen adı">
                    </div>

                    <div class="form-group">
                        <label>LİNK</label>
                        <input type="text" class="form-control" id="m_link" placeholder="http://...">
                    </div>

                    <div class="form-group">
                        <label>AÇIKLAMA</label>
                        <textarea class="form-control" rows="4"></textarea>
                    </div>

                    <div class="form-group form-check d-inline-block mr-4">
                        <input type="checkbox" class="form-check-input" id="m_aktif" checked>
                        <label class="form-check-label">Aktif / Pasif</label>
                    </div>
                    <div class="form-group form-check d-inline-block">
                        <input type="checkbox" class="form-check-input" id="m_silindi">
                        <label class="form-check-label">Silindi</label>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="form-group">
                        <label>RESİMLER</label>
                        <input type="file" class="form-control">
                    </div>
                    <div class="form-group mt-4">
                        <label>DOSYALAR</label>
                        <input type="file" class="form-control">
                    </div>
                </div>
            </div>

            <hr>
            <button class="btn btn-kaydet" onclick="saveModule()">KAYDET</button>
            <span id="saveMsg" class="text-success ml-3" style="display:none; font-weight:600;">Modül Başarıyla Ana Sayfaya Eklendi!</span>
        </div>

        <div class="data-card mt-4" style="background:#fff; border-radius:8px; border:1px solid #e0e0e0; padding:20px;">
            <h6 style="font-weight:600; text-transform:uppercase;">Eklenen Özel Modüller</h6>
            <div class="table-responsive mt-3">
                <table class="table">
                    <thead>
                        <tr>
                            <th>İKON</th>
                            <th>MODÜL ADI</th>
                            <th>LİNK</th>
                            <th>TİP</th>
                            <th>SİL</th>
                        </tr>
                    </thead>
                    <tbody id="customModulesTable">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        



        let currentEditId = null;
        function loadModules() {
            const tbody = document.getElementById('customModulesTable');
            tbody.innerHTML = '';
            
            let customModules = [];
            try {
                customModules = JSON.parse(localStorage.getItem('portal_custom_modules')) || [];
            } catch(e) {}

            if(customModules.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-muted text-center">Henüz özel modül eklenmemiş.</td></tr>';
                return;
            }

            customModules.forEach(mod => {
                tbody.innerHTML += `
                    <tr>
                        <td><i class="${mod.icon}" style="font-size:20px; color:#2196f3;"></i></td>
                        <td>${mod.title}</td>
                        <td>${mod.url}</td>
                        <td>${mod.category}</td>
                        <td><button class="btn btn-sm btn-primary mr-1" onclick="editModule(${mod.id})"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="deleteModule(${mod.id})"><i class="fas fa-trash"></i></button></td>
                    </tr>
                `;
            });
        }

        
        function saveModule() {
            const sira = document.getElementById('m_sira').value;
            const ikon = document.getElementById('m_ikon').value;
            const liste = document.getElementById('m_liste').value;
            const acilis = document.getElementById('m_acilis').value;
            const adi = document.getElementById('m_adi').value;
            const link = document.getElementById('m_link').value;
            const aktif = document.getElementById('m_aktif').checked;

            if(!adi || !link) {
                alert('Lütfen Modül Adı ve Link alanlarını doldurun!');
                return;
            }

            let customModules = JSON.parse(localStorage.getItem('portal_custom_modules')) || [];
            
            if(currentEditId) {
                // Update
                let idx = customModules.findIndex(m => m.id === currentEditId);
                if(idx !== -1) {
                    customModules[idx].sira = sira;
                    customModules[idx].icon = ikon;
                    customModules[idx].category = liste;
                    customModules[idx].acilis = acilis;
                    customModules[idx].title = adi;
                    customModules[idx].url = link;
                    customModules[idx].aktif = aktif;
                }
                currentEditId = null;
                const btn = document.querySelector('.btn-kaydet');
                if(btn) btn.innerText = 'KAYDET';
                
                const msg = document.getElementById('saveMsg');
                msg.innerText = "Modül Başarıyla Güncellendi!";
                msg.style.display = 'inline-block';
                setTimeout(() => { msg.style.display = 'none'; }, 3000);
            } else {
                // Create
                const newMod = {
                    id: Date.now(),
                    sira: sira,
                    icon: ikon,
                    category: liste,
                    acilis: acilis,
                    title: adi,
                    url: link,
                    aktif: aktif
                };
                customModules.push(newMod);
                
                const msg = document.getElementById('saveMsg');
                msg.innerText = "Modül Başarıyla Ana Sayfaya Eklendi!";
                msg.style.display = 'inline-block';
                setTimeout(() => { msg.style.display = 'none'; }, 3000);
            }

            localStorage.setItem('portal_custom_modules', JSON.stringify(customModules));
            
            // Clear form
            document.getElementById('m_sira').value = '1';
            document.getElementById('m_ikon').value = 'fas fa-cube';
            if(document.getElementById('iconPreview')) document.getElementById('iconPreview').className = 'fas fa-cube';
            document.getElementById('m_adi').value = '';
            document.getElementById('m_link').value = '';
            document.getElementById('m_aktif').checked = true;

            loadModules();
        }


        
        function editModule(id) {
            let customModules = JSON.parse(localStorage.getItem('portal_custom_modules')) || [];
            let mod = customModules.find(m => m.id === id);
            if(mod) {
                currentEditId = id;
                document.getElementById('m_sira').value = mod.sira || 1;
                document.getElementById('m_ikon').value = mod.icon;
                if(document.getElementById('iconPreview')) document.getElementById('iconPreview').className = mod.icon;
                document.getElementById('m_liste').value = mod.category;
                document.getElementById('m_acilis').value = mod.acilis || 'direkt';
                document.getElementById('m_adi').value = mod.title;
                document.getElementById('m_link').value = mod.url;
                document.getElementById('m_aktif').checked = mod.aktif;
                
                // Change button text
                const btn = document.querySelector('.btn-kaydet');
                if(btn) btn.innerText = 'GÜNCELLE';
                
                // Scroll to top
                window.scrollTo(0, 0);
            }
        }

        function deleteModule(id) {
            if(confirm('Modülü silmek istediğinize emin misiniz? Ana sayfadan da kalkacaktır.')) {
                let customModules = JSON.parse(localStorage.getItem('portal_custom_modules')) || [];
                customModules = customModules.filter(m => m.id !== id);
                localStorage.setItem('portal_custom_modules', JSON.stringify(customModules));
                loadModules();
            }
        }

        loadModules();
    </script>
    <script src="assets/js/components.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <script src="assets/js/auth.js"></script>
    <script>checkAdminRole();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melikgazi - Gruplar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dashboard_glass.css" id="global-glass-theme">
</head>
<body>

    <div id="navbar-container"></div>

      <div id="sidebar-container"></div>

      <div class="content-area" id="contentArea">
        <a href="dashboard.html" class="btn-back-dashboard"><i class="fas fa-arrow-left"></i> Ana Menüye Dön</a>
        <div class="page-title">GRUPLAR</div>
        
        <div id="listView">
            <button class="btn btn-ekle" onclick="showForm()">EKLE</button>

            <div class="data-card">
                <div class="data-count">Listelenen <strong id="listCount">0</strong></div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>GRUP <i class="fas fa-sort"></i></th>
                                <th>EKLEYEN <i class="fas fa-sort"></i></th>
                                <th>AKTİF Mİ? <i class="fas fa-sort"></i></th>
                                <th>SİLİNDİ Mİ? <i class="fas fa-sort"></i></th>
                                <th>GRUP YETKİLERİNİ YENİLE <i class="fas fa-sort"></i></th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="listTableBody">
                            <!-- Data -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="formView" style="display:none;">
            <div class="card p-4">
                <h5>Grup Ekle</h5>
                <hr>
                <div class="form-group">
                    <label>Grup Adı</label>
                    <input type="text" class="form-control" id="f_group">
                </div>
                <div class="form-group form-check">
                    <input type="checkbox" class="form-check-input" id="f_aktif" checked>
                    <label class="form-check-label">Aktif</label>
                </div>
                <button class="btn btn-primary" onclick="saveData()">Kaydet</button>
                <button class="btn btn-secondary" onclick="hideForm()">İptal</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        



        let gruplarData = [];

        function loadData() {
            try {
                gruplarData = JSON.parse(localStorage.getItem('portal_admin_gruplar')) || [];
            } catch(e) {
                gruplarData = [];
            }
            if (gruplarData.length === 0) {
                // Mock Data
                gruplarData = [
                    { id: 1, grup: 'MESAI-KONTROL', ekleyen: 'arge test', aktif: true, silindi: false },
                    { id: 2, grup: 'Süper Admin', ekleyen: 'arge test', aktif: true, silindi: false },
                    { id: 3, grup: 'User', ekleyen: 'arge test', aktif: true, silindi: false },
                    { id: 4, grup: 'USER-AJANDA', ekleyen: 'Sinan SO. OKTEM', aktif: true, silindi: false },
                    { id: 5, grup: 'USER-YEMEKHANE', ekleyen: 'Sinan SO. OKTEM', aktif: true, silindi: false }
                ];
                localStorage.setItem('portal_admin_gruplar', JSON.stringify(gruplarData));
            }
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('listTableBody');
            tbody.innerHTML = '';
            document.getElementById('listCount').innerText = gruplarData.length;

            gruplarData.forEach(item => {
                const aktifClass = item.aktif ? 'status-active' : 'status-passive';
                const aktifText = item.aktif ? 'Aktif' : 'Pasif';
                const silindiClass = item.silindi ? 'status-passive' : 'status-active';
                const silindiText = item.silindi ? 'Pasif' : 'Aktif';

                tbody.innerHTML += `
                    <tr>
                        <td>${item.grup}</td>
                        <td>${item.ekleyen}</td>
                        <td><span class="${aktifClass}">${aktifText}</span><span class="status-line"></span></td>
                        <td><span class="${silindiClass}">${silindiText}</span><span class="status-line"></span></td>
                        <td><button class="btn btn-yenile" onclick="alert('Yetkiler yenilendi.')">YETKİLERİ YENİLE</button></td>
                        <td><i class="fas fa-ellipsis-v text-muted" style="cursor:pointer;" onclick="deleteItem(${item.id})"></i></td>
                    </tr>
                `;
            });
        }

        function showForm() {
            document.getElementById('listView').style.display = 'none';
            document.getElementById('formView').style.display = 'block';
        }

        function hideForm() {
            document.getElementById('formView').style.display = 'none';
            document.getElementById('listView').style.display = 'block';
        }

        
        function editItem(id) {
            let item = groupData.find(i => i.id === id);
            if(item) {
                currentEditId = id;
                document.getElementById('f_group').value = item.grupAdi;
                document.getElementById('f_aktif').checked = item.aktif;
                const btn = document.querySelector('#formView .btn-primary');
                if(btn) btn.innerText = 'Güncelle';
                showForm();
            }
        }
        function saveData() {
            const aktif = document.getElementById('f_aktif').checked;
            const grupAdi = document.getElementById('f_group').value;
            
            if(!grupAdi) { alert('Grup adı giriniz!'); return; }
            
            if(currentEditId) {
                let item = groupData.find(i => i.id === currentEditId);
                if(item) {
                    item.aktif = aktif;
                    item.grupAdi = grupAdi;
                }
                currentEditId = null;
            } else {
                groupData.unshift({
                    id: Date.now(),
                    ekleyen: currentUsername,
                    aktif: aktif,
                    grupAdi: grupAdi,
                    silindi: false
                });
            }
            localStorage.setItem('portal_admin_gruplar', JSON.stringify(groupData));
            const btn = document.querySelector('#formView .btn-primary');
            if(btn) btn.innerText = 'Kaydet';
            document.getElementById('f_group').value = '';
            hideForm();
            renderTable();
        }


        function deleteItem(id) {
            if(confirm('Silmek istediğinize emin misiniz?')) {
                gruplarData = gruplarData.filter(i => i.id !== id);
                localStorage.setItem('portal_admin_gruplar', JSON.stringify(gruplarData));
                renderTable();
            }
        }

        loadData();
    </script>
    <script src="assets/js/components.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <script src="assets/js/auth.js"></script>
    <script>checkAdminRole();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melikgazi - Listeler Yönetimi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dashboard_glass.css" id="global-glass-theme">
</head>
<body>

    
    <div id="sidebar-container"></div>

      <div class="container-fluid content-area">
        <a href="dashboard.html" class="btn-back-dashboard"><i class="fas fa-arrow-left"></i> Ana Menüye Dön</a>
        <div class="page-title">LİSTELER</div>
        
        <!-- List View -->
        <div id="listView">
            <button class="btn btn-ekle" onclick="showForm()">EKLE</button>
            
            <div class="filter-card">
                <div class="filter-group">
                    <label>Aktif Pasif</label>
                    <select><option>Tümü</option></select>
                </div>
                <div class="filter-group">
                    <label>Durum</label>
                    <select><option>Tümü</option></select>
                </div>
                <div class="filter-group">
                    <label>Başlık</label>
                    <input type="text">
                </div>
                <div class="filter-group">
                    <label>Ekleyen</label>
                    <select><option>Tümü</option></select>
                </div>
                <div>
                    <button class="btn btn-reset">SIFIRLA</button>
                    <button class="btn btn-filter">FİLTRELE</button>
                </div>
            </div>

            <div class="data-card">
                <div class="data-count">Listelenen <strong id="listCount">0</strong></div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>BAŞLIK <i class="fas fa-sort"></i></th>
                                <th>BAŞLANGIÇ <i class="fas fa-sort"></i></th>
                                <th>BİTİŞ <i class="fas fa-sort"></i></th>
                                <th>EKLEYEN <i class="fas fa-sort"></i></th>
                                <th>AKTİF Mİ? <i class="fas fa-sort"></i></th>
                                <th>SİLİNDİ Mİ? <i class="fas fa-sort"></i></th>
                                <th>KAYIT TARİHİ <i class="fas fa-sort"></i></th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="listTableBody">
                            <!-- Data will be loaded here via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Form View -->
        <div id="formView" class="form-card">
            <div class="row">
                <div class="col-md-6 form-group">
                    <label>BAŞLIK</label>
                    <input type="text" class="form-control" id="f_baslik">
                </div>
                <div class="col-md-6 form-group">
                    <label>İKON</label>
                    <input type="file" class="form-control" style="padding-bottom: 35px;">
                </div>
                <div class="col-md-6 form-group">
                    <label>BAŞLANGIÇ TARİHİ</label>
                    <input type="date" class="form-control" id="f_baslangic">
                </div>
                <div class="col-md-6 form-group">
                    <label>BİTİŞ TARİHİ</label>
                    <input type="date" class="form-control" id="f_bitis">
                </div>
                <div class="col-md-12 form-group">
                    <label>AÇIKLAMA</label>
                    <div class="rich-text-toolbar">
                        <span>Normal <i class="fas fa-caret-down"></i></span>
                        <i class="fas fa-bold"></i>
                        <i class="fas fa-italic"></i>
                        <i class="fas fa-underline"></i>
                        <i class="fas fa-link"></i>
                        <i class="fas fa-list-ul"></i>
                        <i class="fas fa-list-ol"></i>
                    </div>
                    <div class="rich-text-editor" contenteditable="true" id="f_aciklama"></div>
                </div>
                
                <div class="col-md-12 d-flex justify-content-between mt-3 mb-4">
                    <div class="custom-control custom-checkbox">
                        <input type="checkbox" class="custom-control-input" id="f_aktif" checked>
                        <label class="custom-control-label" for="f_aktif" style="text-transform:none; font-weight: 500; font-size: 14px;">Aktif / Pasif</label>
                    </div>
                    <div class="custom-control custom-checkbox">
                        <input type="checkbox" class="custom-control-input" id="f_silindi">
                        <label class="custom-control-label" for="f_silindi" style="text-transform:none; font-weight: 500; font-size: 14px;">Silindi</label>
                    </div>
                </div>
                
                <div class="col-md-12">
                    <button class="btn btn-filter" onclick="saveData()">KAYDET</button>
                    <button class="btn btn-secondary ml-2" onclick="showList()">İPTAL</button>
                </div>
            </div>
        </div>

    </div>

    

    <script src="assets/js/components.js"></script>
</body>
</html>

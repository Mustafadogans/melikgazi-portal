<!DOCTYPE html>
<html lang="tr">
<head>
    <script src="assets/js/auth.js"></script>
    <script>checkAdminRole();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melikgazi - Kullanıcılar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dashboard_glass.css" id="global-glass-theme">
</head>
<body>

    <div id="navbar-container"></div>

      <div id="sidebar-container"></div>

      <div class="content-area" id="contentArea">
        <a href="dashboard.html" class="btn-back-dashboard"><i class="fas fa-arrow-left"></i> Ana Menüye Dön</a>
        <div class="page-title">KULLANICILAR</div>
        
        <div id="listView">
            <button class="btn btn-ekle" onclick="alert('Kullanıcı senkronizasyonu LDAP üzerinden yapılacaktır. Şimdilik pasiftir.')" style="background-color: #17a2b8; opacity: 0.8;">KULLANICILARI ÇEK</button>
            

            <div class="filter-card">
                <div class="filter-group">
                    <label>Aktif Pasif</label>
                    <select><option>Tümü</option></select>
                </div>
                <div class="filter-group">
                    <label>Durum</label>
                    <select><option>Tümü</option></select>
                </div>
                <div class="filter-group">
                    <label>İsim Soyisim</label>
                    <input type="text">
                </div>
                <div>
                    <button class="btn btn-reset">SIFIRLA</button>
                    <button class="btn btn-filter">FİLTRELE</button>
                </div>
            </div>

            <div class="data-card">
                <div class="data-count">Listelenen <strong id="listCount">0</strong></div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>GRUP <i class="fas fa-sort"></i></th>
                                <th>İSİM SOYİSİM <i class="fas fa-sort"></i></th>
                                <th>KULLANICI ADI <i class="fas fa-sort"></i></th>
                                <th>EMAIL <i class="fas fa-sort"></i></th>
                                <th>AKTİF Mİ? <i class="fas fa-sort"></i></th>
                                <th>SİLİNDİ Mİ? <i class="fas fa-sort"></i></th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="listTableBody">
                            <!-- Data -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        document.getElementById('menuToggle').addEventListener('click', function() {
            document.getElementById('sidebarMenu').classList.toggle('active');
            document.getElementById('contentArea').classList.toggle('shifted');
        });

        const currentUsername = localStorage.getItem('portal_username') || 'arge test';
        document.getElementById('adminUsername').innerText = currentUsername;



        let kullaniciData = [];

        function loadData() {
            try {
                kullaniciData = JSON.parse(localStorage.getItem('portal_admin_kullanicilar')) || [];
            } catch(e) {
                kullaniciData = [];
            }
            if (kullaniciData.length === 0) {
                // Mock Data
                kullaniciData = [
                    { id: 1, grup: 'Süper Admin', isim: 'Enes EC. CABAS', kadi: 'ecabas', email: 'enes.cabas@melikgazi.bel.tr', aktif: true, silindi: false },
                    { id: 2, grup: 'Süper Admin', isim: 'Mehmet Ali MAK. KARADAS', kadi: 'makaradas', email: 'makaradas@melikgazi.bel.tr', aktif: true, silindi: false },
                    { id: 3, grup: 'Süper Admin', isim: 'Muhammed Sami MSM. MARUFOGLU', kadi: 'msmarufoglu', email: 'muhammed.marufoglu@melikgazi.bel.tr', aktif: true, silindi: false },
                    { id: 4, grup: 'Süper Admin', isim: 'Ahmet AK. KARGI', kadi: 'ahmetkargi', email: 'ahmetkargi@melikgazi.bel.tr', aktif: true, silindi: false },
                    { id: 5, grup: 'Süper Admin', isim: 'Sinan SO. OKTEM', kadi: 'soktem', email: 'sinan.oktem@melikgazi.bel.tr', aktif: true, silindi: false },
                    { id: 6, grup: 'Süper Admin', isim: 'arge test', kadi: 'argetest', email: 'argetest@system.local', aktif: true, silindi: false }
                ];
                localStorage.setItem('portal_admin_kullanicilar', JSON.stringify(kullaniciData));
            }
            renderTable();
        }

        
        function renderTable() {
            const tbody = document.getElementById('listTableBody');
            tbody.innerHTML = '';
            document.getElementById('listCount').innerText = kullaniciData.length;

            kullaniciData.forEach(item => {
                const aktifClass = item.aktif ? 'status-active' : 'status-passive';
                const aktifText = item.aktif ? 'Aktif' : 'Pasif';
                const silindiClass = item.silindi ? 'status-passive' : 'status-active';
                const silindiText = item.silindi ? 'Pasif' : 'Aktif';

                tbody.innerHTML += `
                    <tr>
                        <td>${item.grup}</td>
                        <td>${item.isim} <span class="desc-muted">En Yetkili Kullanıcı</span></td>
                        <td>${item.kadi}<span class="desc-muted">${item.kadi}@system.local</span></td>
                        <td>${item.email}</td>
                        <td><span class="${aktifClass}">${aktifText}</span><span class="status-line"></span></td>
                        <td><span class="${silindiClass}">${silindiText}</span><span class="status-line"></span></td>
                        <td><i class="fas fa-ellipsis-v text-muted" style="cursor:pointer;" onclick="deleteItem(${item.id})"></i></td>
                    </tr>
                `;
            });
        }

        function deleteItem(id) {
            if(confirm('Silmek istediğinize emin misiniz?')) {
                kullaniciData = kullaniciData.filter(i => i.id !== id);
                localStorage.setItem('portal_admin_kullanicilar', JSON.stringify(kullaniciData));
                renderTable();
            }
        }

        loadData();
    </script>
    <script src="assets/js/components.js"></script>
</body>
</html>

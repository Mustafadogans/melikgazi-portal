<!DOCTYPE html>
<html lang="tr">
<head>
    <script src="assets/js/auth.js"></script>
    <script>checkAdminRole();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melikgazi - Yemek Menüsü Yönetimi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/dashboard_glass.css" id="global-glass-theme">
</head>
<body>

    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

      <div class="container-fluid content-area">
        <a href="dashboard.html" class="btn-back-dashboard"><i class="fas fa-arrow-left"></i> Ana Menüye Dön</a>
        <div class="page-title">YEMEK MENÜSÜ YÖNETİMİ</div>
        
        <!-- List View -->
        <div id="listView">
            <button class="btn btn-ekle" onclick="showForm()">MENÜ EKLE</button>
            
            <div class="data-card mt-4">
                <div class="data-count">Kayıtlı Menü Sayısı <strong id="listCount">0</strong></div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>TARİH <i class="fas fa-sort"></i></th>
                                <th>MENÜ İÇERİĞİ</th>
                                <th>İŞLEMLER</th>
                            </tr>
                        </thead>
                        <tbody id="listTableBody">
                            <!-- Data will be loaded here via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Form View -->
        <div id="formView" class="form-card" style="display: none;">
            <h5 class="mb-4 font-weight-bold" style="color: #2c3e50;">Yeni Menü Ekle / Düzenle</h5>
            <div class="row">
                <div class="col-md-6 form-group">
                    <label>TARİH (YYYY-AA-GG)</label>
                    <input type="date" class="form-control" id="f_tarih">
                </div>
                
                <div class="col-md-12 form-group">
                    <label>YEMEK LİSTESİ (Her yemeği yeni bir satıra yazın)</label>
                    <textarea class="form-control" id="f_yemekler" rows="6" placeholder="Örnek:\nMercimek Çorbası\nPatlıcan Güveç\nPirnç Pilavı\nCacık"></textarea>
                </div>
                
                <div class="col-md-12 mt-3">
                    <button class="btn btn-filter" onclick="saveData()">KAYDET</button>
                    <button class="btn btn-secondary ml-2" onclick="showList()">İPTAL</button>
                </div>
            </div>
        </div>

    </div>

    <script src="assets/js/components.js"></script>
    <script>
        // Yemek Menüsü Logic
        const STORAGE_KEY = 'portal_yemek_menu';
        let isEditing = false;
        let editDate = null;

        function loadData() {
            let data = {};
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) data = JSON.parse(raw);
            } catch(e) {
                console.error("Yemek verisi okunamadı:", e);
            }
            return data;
        }

        function saveDataToLocal(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function renderTable() {
            const data = loadData();
            const tbody = document.getElementById('listTableBody');
            tbody.innerHTML = '';
            
            const dates = Object.keys(data).sort((a,b) => b.localeCompare(a)); // En yeni en üstte
            document.getElementById('listCount').innerText = dates.length;

            if (dates.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Henüz hiç yemek menüsü eklenmedi.</td></tr>';
                return;
            }

            dates.forEach(date => {
                const items = data[date];
                const itemsHtml = items.map(i => `<span class="badge badge-light" style="font-size: 13px; border: 1px solid #ddd; margin-right: 5px;">${i}</span>`).join('');
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="font-weight-bold">${formatDateForDisplay(date)}</td>
                    <td>${itemsHtml}</td>
                    <td>
                        <button class="btn btn-sm btn-info" onclick="editDateMenu('${date}')"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-danger ml-1" onclick="deleteDateMenu('${date}')"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function formatDateForDisplay(isoString) {
            const parts = isoString.split('-');
            if(parts.length !== 3) return isoString;
            return `${parts[2]}.${parts[1]}.${parts[0]}`;
        }

        function showForm() {
            document.getElementById('listView').style.display = 'none';
            document.getElementById('formView').style.display = 'block';
            
            if(!isEditing) {
                document.getElementById('f_tarih').value = '';
                document.getElementById('f_tarih').disabled = false;
                document.getElementById('f_yemekler').value = '';
            }
        }

        function showList() {
            document.getElementById('listView').style.display = 'block';
            document.getElementById('formView').style.display = 'none';
            isEditing = false;
            editDate = null;
            renderTable();
        }

        function editDateMenu(date) {
            const data = loadData();
            if(!data[date]) return;
            
            isEditing = true;
            editDate = date;
            
            document.getElementById('f_tarih').value = date;
            document.getElementById('f_tarih').disabled = true; // Tarih değiştirilemez
            document.getElementById('f_yemekler').value = data[date].join('\\n');
            
            showForm();
        }

        function deleteDateMenu(date) {
            if(confirm(date + " tarihli menüyü silmek istediğinize emin misiniz?")) {
                const data = loadData();
                delete data[date];
                saveDataToLocal(data);
                renderTable();
            }
        }

        function saveData() {
            const tarih = document.getElementById('f_tarih').value;
            const yemeklerRaw = document.getElementById('f_yemekler').value;
            
            if(!tarih) {
                alert("Lütfen bir tarih seçin.");
                return;
            }
            if(!yemeklerRaw.trim()) {
                alert("Lütfen yemek listesini girin.");
                return;
            }

            const yemekListesi = yemeklerRaw.split('\\n').map(t => t.trim()).filter(t => t !== '');
            
            const data = loadData();
            
            // Eğer yeni ekleniyorsa ve o tarihte zaten varsa
            if(!isEditing && data[tarih]) {
                if(!confirm("Bu tarihe ait bir menü zaten var. Üzerine yazmak istiyor musunuz?")) {
                    return;
                }
            }

            data[tarih] = yemekListesi;
            saveDataToLocal(data);
            
            alert("Menü başarıyla kaydedildi.");
            showList();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Eğer veritabanı boşsa ve örnek bir veri istiyorsak:
            let data = loadData();
            if(Object.keys(data).length === 0) {
                data['2026-07-28'] = ['MERCİMEK ÇORBASI', 'PATLICAN GÜVEÇ', 'PİRİNÇ PİLAVI', 'CACIK'];
                saveDataToLocal(data);
            }
            renderTable();
        });
    </script>
</body>
</html>
